[project]
name = "sleep-smart-solver"
version = "0.1.0"
description = "Exam-crunch study planner (FastAPI + OR-Tools CP-SAT) for Sleep Smart MRU"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.118,<1",
  "uvicorn>=0.34,<1",
  "ortools>=9.15,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
